<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Calendario dell’Avvento</title>
<style>
*{box-sizing:border-box}
:root{--gold:#f2c75c;--card:#9b2a3a;--card2:#6e1a27;--text:#fff8ea;--muted:#d7e8dd}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#4aa981 0%,#2a7557 100%) fixed;color:var(--text);font-family:Georgia,"Times New Roman",serif;padding:22px 14px 44px}
header{text-align:center;max-width:720px;margin:0 auto 14px}
h1{font-size:clamp(1.7rem,6vw,2.6rem);margin:.1em 0 .2em;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.25)}
#staff{display:block;width:100%;max-width:460px;margin:0 auto}
.bar{text-align:center;margin:8px 0;font-size:.9rem}
#status{text-align:center;min-height:1.3em;margin:6px 0 10px;color:var(--muted)}
.grid{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px}
@media (min-width:430px){.grid{grid-template-columns:repeat(4,1fr)}}
@media (min-width:600px){.grid{grid-template-columns:repeat(6,1fr)}}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px}
.deco{font-size:1.8rem;line-height:1.2;height:2.3rem;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.duck{position:relative;display:inline-block}
.duck svg{position:absolute;width:.95em;left:.02em;top:-.42em;transform:rotate(-14deg);pointer-events:none}
.box{width:100%;aspect-ratio:1;border:2px solid var(--gold);border-radius:14px;background:linear-gradient(145deg,var(--card),var(--card2));color:var(--text);font:inherit;font-size:1.6rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.box small{font-size:.85rem;color:var(--gold)}
.box:hover:not(.locked){transform:translateY(-2px)}
.box.locked{opacity:.55;cursor:not-allowed;border-style:dashed}
dialog{border:2px solid var(--gold);border-radius:16px;background:#215f47;color:var(--text);max-width:min(560px,94vw);width:100%;padding:18px;font-family:Georgia,serif}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 10px;color:var(--gold)}
dialog img{max-width:100%;border-radius:10px;display:block;margin:0 auto 12px}
dialog audio{width:100%;margin:8px 0}
.phrase{font-size:1.15rem;line-height:1.5;font-style:italic;margin:10px 0}
.close{display:block;margin:14px 0 0 auto;background:var(--gold);color:#3a2705;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>Calendario dell’Avvento</h1>
  <svg id="staff" viewBox="0 0 440 82" aria-hidden="true"></svg>
</header>
<div class="bar" id="bar" hidden><label><input type="checkbox" id="test"> Modalità test (sblocca tutte le caselle)</label></div>
<div id="status"></div>
<main class="grid" id="grid"></main>
<dialog id="dlg"></dialog>

<script src="frasi.js"></script>
<script>
(function(){
  var YEAR = new Date().getFullYear();
  var FRASI = window.FRASI || {};
  var testMode = false;
  var XMAS = ['🎄','⛄','🎁','⭐','🕯️','🦌','🍪','🧦','❄️','🛷','🍬','🎅'];
  var INSTR = ['🎸','🎹','🎺','🥁','🎻','🎤','🎷','🎧','🎼','🔔','🎵','🎙️'];
  var HAT = '<svg viewBox="0 0 24 20"><path d="M2 17 Q6 2 18 3 L20 17Z" fill="#d62839"/><rect x="1" y="15" width="21" height="5" rx="2.5" fill="#fff"/><circle cx="19" cy="3.5" r="3" fill="#fff"/></svg>';
  var grid = document.getElementById('grid'), dlg = document.getElementById('dlg'), statusEl = document.getElementById('status');
  var pad = function(n){ return ('0' + n).slice(-2); };

  /* Pentagramma con note vere: l'inizio di "Joy to the World" (Do-Si-La-Sol-Fa-Mi-Re-Do) */
  (function drawStaff(){
    var NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('staff');
    function el(name, attrs){ var e = document.createElementNS(NS, name); for (var k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; }
    [15,25,35,45,55].forEach(function(y){ el('line',{x1:10,x2:430,y1:y,y2:y,stroke:'#f2c75c','stroke-width':1.3}); });
    el('line',{x1:10,x2:10,y1:15,y2:55,stroke:'#f2c75c','stroke-width':1.6});
    el('line',{x1:424,x2:424,y1:15,y2:55,stroke:'#f2c75c','stroke-width':1.3});
    el('line',{x1:429,x2:429,y1:15,y2:55,stroke:'#f2c75c','stroke-width':3});
    var ys = [30,35,40,45,50,55,60,65];
    ys.forEach(function(y,i){
      var x = 40 + i * 48, last = i === ys.length - 1;
      if (y === 65) el('line',{x1:x-11,x2:x+11,y1:65,y2:65,stroke:'#f2c75c','stroke-width':1.3});
      el('ellipse',{cx:x,cy:y,rx:6.8,ry:5,transform:'rotate(-20 '+x+' '+y+')',fill:last?'none':'#fff8ea',stroke:'#fff8ea','stroke-width':last?1.8:1});
      if (y <= 35) el('line',{x1:x-6.3,x2:x-6.3,y1:y+2,y2:y+30,stroke:'#fff8ea','stroke-width':1.6});
      else el('line',{x1:x+6.3,x2:x+6.3,y1:y-2,y2:y-30,stroke:'#fff8ea','stroke-width':1.6});
    });
  })();

  function unlocked(n){ return testMode || new Date() >= new Date(YEAR, 11, n, 0, 0, 0); }

  function deco(n){
    var d = document.createElement('div'); d.className = 'deco';
    if (n % 2 === 1){ d.textContent = XMAS[(n - 1) / 2]; }
    else {
      var duck = document.createElement('span'); duck.className = 'duck'; duck.textContent = '🦆';
      duck.insertAdjacentHTML('beforeend', HAT);
      var ins = document.createElement('span'); ins.textContent = INSTR[n / 2 - 1];
      d.appendChild(duck); d.appendChild(ins);
    }
    return d;
  }

  function render(){
    grid.textContent = '';
    for (var n = 1; n <= 24; n++){ (function(n){
      var cell = document.createElement('div'); cell.className = 'cell';
      cell.appendChild(deco(n));
      var b = document.createElement('button'); b.className = 'box' + (unlocked(n) ? '' : ' locked');
      var s1 = document.createElement('span'); s1.textContent = n;
      var s2 = document.createElement('small'); s2.textContent = unlocked(n) ? '♪' : '🔒';
      b.appendChild(s1); b.appendChild(s2);
      b.addEventListener('click', function(){
        if (!unlocked(n)){ statusEl.textContent = 'Questa casella si apre il ' + n + ' dicembre 🎄'; return; }
        statusEl.textContent = ''; openDay(n);
      });
      cell.appendChild(b); grid.appendChild(cell);
    })(n); }
  }

  /* prova varie estensioni; se nessun file esiste, rimuove l'elemento */
  function tryChain(node, base, exts){
    var i = 0;
    function next(){ if (i >= exts.length){ node.remove(); return; } node.src = base + exts[i++]; }
    node.addEventListener('error', next);
    next();
  }

  function openDay(n){
    dlg.textContent = '';
    var h = document.createElement('h2'); h.textContent = n + ' dicembre'; dlg.appendChild(h);
    var img = document.createElement('img'); img.alt = ''; dlg.appendChild(img);
    tryChain(img, 'img/' + pad(n), ['.jpg','.jpeg','.png','.webp']);
    var f = FRASI[n];
    if (f){ var p = document.createElement('div'); p.className = 'phrase'; p.textContent = f; dlg.appendChild(p); }
    var au = document.createElement('audio'); au.controls = true; au.preload = 'none'; dlg.appendChild(au);
    tryChain(au, 'audio/' + pad(n), ['.mp3','.m4a','.ogg','.wav']);
    var c = document.createElement('button'); c.className = 'close'; c.textContent = 'Chiudi';
    c.addEventListener('click', function(){ au.pause(); dlg.close(); });
    dlg.appendChild(c);
    dlg.showModal();
  }
  dlg.addEventListener('close', function(){ var a = dlg.querySelector('audio'); if (a) a.pause(); });

  if (/[?&]test/.test(location.search)){
    var bar = document.getElementById('bar'), t = document.getElementById('test');
    bar.hidden = false;
    t.addEventListener('change', function(){ testMode = t.checked; render(); });
  }
  render();
})();
</script>
</body>
</html>
